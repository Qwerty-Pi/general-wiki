<style>
html, body {
    height: 100%;
    margin: 0;
    padding: 0;
}

#iframe {
	height: 100%;
	width: 100%;
}
</style>

<div>
	Session ID <input id="session-id" type="text" value="L"/>
	<button id="load-button">Load</button>
</div>

<script>
 	function openUreply() {
                var sessionID = $("#session-id").val()
                var site = `https://server3.ureply.mobi/v7/student/mobile_index.php?join=${sessionID}`
                window.open(site, '_newtab');
        }

	document.onKeyPress = function(event) {
    		if (event.keyCode === 13) {
    			openUreply();
		}
	}

	$("#load-button").on('click', openUreply);

</script>
