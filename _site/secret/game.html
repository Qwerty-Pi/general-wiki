<style>
:root {
	--terminal-white: #cccccc;
	--terminal-black: #151515;
	--pine: #1ac42d;
	--plum: #c92d22;
	--bamboo: #dbc518;
	--camphor: #0e75c9;
}
* :not(mjx-container *) {
	font-family: 'Cascadia Code';
}

html, body {
	height: 100%;
	margin: 0px;
}
button {
	background-color: red;
	border: 0px;
	margin: 0px;
	&:hover {
		background-color: palevioletred;
	}
}

.game-container {
	width: 100%;
	height: 100%;
	display: flex;
	flex-direction: column; 
}

.game-header {
	display: flex;
	flex-direction: horizontal;
	justify-content: space-between;
	padding: 0.5em;
	font-size: 1.5em;
	flex: 0 1 auto;
	
	background-color: var(--terminal-black);
	color: var(--terminal-white);
	&::selection {
		background-color: var(--terminal-white);
		color: var(--terminal-black);
	}
}

.question-content {
	padding: 0.5em;
	flex: 1 1 auto;
	overflow-y: auto; 
	
	background-color: var(--terminal-black);
	color: var(--terminal-white);
	&::selection {
		background-color: var(--terminal-white);
		color: var(--terminal-black);
	}
}

::-webkit-scrollbar-track {
    -webkit-box-shadow: inset 0 0 6px rgba(0,0,0,0.3); 
    -webkit-border-radius: 10px;
    border-radius: 10px;
}

::-webkit-scrollbar-thumb {
    -webkit-border-radius: 10px;
    border-radius: 10px;
    background: rgba(255,0,0,0.8); 
    -webkit-box-shadow: inset 0 0 6px rgba(0,0,0,0.5); 
}
::-webkit-scrollbar-thumb:window-inactive {
    background: rgba(255,0,0,0.4); 
}

.game-options {
	display: grid;
	grid-template-columns: 1fr 1fr;
	flex: 0 1 auto;
}

*.unselectable {
   -moz-user-select: -moz-none;
   -khtml-user-select: none;
   -webkit-user-select: none;

   /*
     Introduced in IE 10.
     See http://ie.microsoft.com/testdrive/HTML5/msUserSelect/
   */
   -ms-user-select: none;
   user-select: none;
}

.stats-container {
	/* background-color: gray; */
}

.game-option {
	padding: 0.5em 0em;
	font-size: 3em;
	font-family: 'Cascadia Code';
}

.game-option.option-x {
	background-color: grey;
	&:hover {
		background-color: color-mix(in srgb, grey 50%, transparent);
	}
}
.game-option.option-a {
	background-color: var(--pine);
	&:hover {
		background-color: color-mix(in srgb, var(--pine) 50%, transparent);
	}
}
.game-option.option-b {
	background-color: var(--plum);
	&:hover {

.game-option.option-c {

}
.game-option.option-d {
	background-color: var(--camphor);
	&:hover {
		background-color: color-mix(in srgb, var(--camphor) 50%, transparent);
	}

<script src="/secret/functions.js"></script>
<script>
	const Game = {
		load: function (year, qid) {
			if (!(year in questions)) {
				promises = []
				promises.push(loadQuestionJson('2', year))
				promises.push(loadAnswerJson('2', year))
				Promise.all(promises).then(async function () {
					const content = await getQuestionContent([year, qid], questions[year][qid])
					$("#game-screen").html(content.html())
					await MathJax.typesetPromise()
				})
			}
		},
		loadRandom: function () {
			year = parseInt(2012 + Math.floor(Math.random() * 14))
			qid = parseInt(Math.floor(Math.random() * 45))
			this.load(year, qid)
		},
		send: function (option) {
			$('.game-screen').html($('.game-screen').html() + option)
		}
	}

	$(".game-option").on('click', function (e) {
		const option = $(this).data('option')
		Game.send(option)
	})

	Game.loadRandom()

	$(document).on('keydown', function(e) {
		e = e || window.event
		if (e.ctrlKey === true)
			return;
		switch (e.keyCode) {
			case 65:
				Game.send('A')
				break
			case 66:
				Game.send('B')
				break
			case 67:
				Game.send('C')
				break
			case 68:
				Game.send('D')
				break
			case 88:
				Game.send('X')
				break
		}
	})
</script>
