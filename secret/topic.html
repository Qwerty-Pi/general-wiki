<script>
    async function loadData() {
        promises = []
        for (const year of years) {
            promises.push(loadQuestionJson('2', year))
            promises.push(loadTopicJson('2', year))
            promises.push(loadAnswerJson('2', year))
        }
        Promise.all(promises).then(() => {
            document.getElementById("load").style = "display: none"
            $("#topic").prop('disabled', false)
            loadTopic()
        })
    }

    async function changeTopic() {
        const label = $("#change-question-label").val()
        const parts = label.split(" ")
        const year = parts[0]
        const q = parts[1]
        const topic = $("#change-topic").val()

        let data = {
            'year': year,
            'q': q,
            'topic': topic
        }

        let headers = {
            "Content-Type": "application/json"
        }

        res = await fetch("update_topic.php", {
            method: "POST",
            headers: headers,
            body: JSON.stringify(data)
        })

        console.log(await res.text())
    }

    async function loadTopic() {
        const topic = $("#topic").val()
        const container = $("#question-container")
        container.html("")
        let qid = 1;
        for (const year of years) {
            for (const q in questions[year]) {
                if (topics[year][q] == topic) {
                    appendQuestion(container, qid, [year, parseInt(q)+1], questions[year][q], answers[year][q])
                    qid += 1;
                }
            }
        }
        $("#change-topic").val(topic)
        $(".question-content").on('click', function(e) {
            $("#change-question-label").val($(e.currentTarget).data("identifier"))
            $("#change-question-label").change()
        })
        $(".question-label").on('click', function(e) {
            toggleAnswer($(e.currentTarget))
        })
        
        await MathJax.typesetPromise();
    }
    loadData()

    document.getElementById("topic").addEventListener('change', function() {
        loadTopic();
    })
</script>
