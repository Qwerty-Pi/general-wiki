---
layout: default
---
	
<h1>Project Euler</h1>

Question <input id="qid" style="width: 4em;" type="number">
<button id="pe-load" onclick="loadQuestion()">Load</button>

<div id="pe-question-container">
</div>

<script>
	function loadQuestion() {
		var qid = document.getElementById("qid").value
		var container = document.getElementById("pe-question-container")
		var url = `https://projecteuler.net/minimal=${qid}`
		fetch(url).then(res => res.text()).then(res => { container.innerHTML = res.replace("resources/", "https://projecteuler.net/resources/"); MathJax.typesetPromise()})
	}
</script>
