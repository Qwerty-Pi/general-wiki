	<style>
#contest-scoreboard {
    display: grid;
     /* solves + penalty + 13 tasks; dynamically adjusted */
    grid-template-columns: 1fr 6fr repeat(15, 1fr);
    text-align: center;
}

#contest-scoreboard > div {
    display: flex;
    justify-content: center;    
    align-items: center;
    border: solid color-mix(in srgb, var(--background-color) 95%, var(--text-color) 5%) 1px;
    min-height: 3em;
    min-width: 4em;
}

.first-solved {
    background-color: color-mix(in srgb, var(--background-color) 50%, var(--dark-green) 50%);
}

.accepted {
    background-color: color-mix(in srgb, var(--background-color) 50%, var(--light-green) 50%);
}

.freezed {
    background-color: color-mix(in srgb, var(--background-color) 50%, var(--yellow) 50%);
}

.rejected {
    background-color: color-mix(in srgb, var(--background-color) 50%, var(--red) 50%);
}

#control-bar {
    display: flex;
    flex-direction: row;
}

#control-bar > * {
    margin-right: 0.5em;
}

#contest-metadata {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
}

.task-stats {
    min-height: 1.5em !important;
}

.task-label:hover {
    cursor: pointer;
}

.popover {
    background-color: var(--background-color);
}
</style>

<script src="/ICPC/scoreboard/scoreboard-converter.js"></script>


<div id="add-submission-popover" class="popover" popover="auto">
    <div style="text-align: center;"><span id="task-id" style="font-size: 3em;"></span></div>
    <div>
        <button
            onclick="addSubmission($('#task-id').html(), 'accepted'); $(this).parent().parent().hide();"
            class="accepted"    
        >Accepted</button>
        <button
            onclick="addSubmission($('#task-id').html(), 'rejected'); $(this).parent().parent().hide();"
            class="rejected"
        >Rejected</button>
    </div>
</div>

<div id="control-bar">
    <div>
        <select id="contest-source">
            <option value="local">Local</option>
            <option value="xcpc" selected>XCPC</option>
        </select>
    </div>
    <div><input id="contest-id" value="icpc/51st/wuhan" placeholder="icpc/51st/wuhan"/></div>
    <div>Start: <input id="start-time" type="datetime-local"/></div>
    <button id="fetch-contest">Fetch</button>
</div>

<div id="contest-metadata" style="display: none">
    <span id="contest-name"></span>
    <span id="current-time"></span>
</div>

<div id="contest-scoreboard"></div>

<script src="https://cdn.jsdelivr.net/npm/opencc-js@1.5.0-beta.0/dist/umd/full.js">
</script>

<script>
    const languageConverter = OpenCC.Converter({ from: 'cn', to: 'hk' });

    function fetchContest(source, contestId) {
        if (source === 'local') {
            fetch(`/ICPC/scoreboard/${contestId}.json`)
                .then((res) => res.json())
                .then((json) => loadContest(json))
                .then(() => { if ($("#contest-scoreboard").html().strip() !== "") $("#control-bar").css("display", "none") });
        } else if (source === 'xcpc') {
            fetchXCPCData(contestId)
                .then((json) => loadContest(json))
                .then(() => { if ($("#contest-scoreboard").html() !== "") $("#control-bar").css("display", "none") });
        }
        // remove the control bar if success
    }

    $("#fetch-contest").on('click', function() {
        const source = $("#contest-source").val();
        const contestId = $("#contest-id").val();
        fetchContest(source, contestId);
    })

    $("#start-time").on("input", function() {
        loadScoreboard();
    })
    
    var now = new Date();
    var datetime = now.getTime() - now.getTimezoneOffset() * 60000;
    const five_minutes = 5 * 60 * 1000;
    // round up to next five minutes
    datetime = Math.ceil((datetime + five_minutes) / five_minutes) * five_minutes;
    $("#start-time").val(new Date(datetime).toISOString().substring(0, 19));
    
    var name, tasks;
    var duration, freeze; // in seconds for consistency
    var teams;
    var submissions;
    var timeout = null; // stop previous timeout when we call another one
    let prevEffectiveTime = -1;

    // get the team identifier from the submission
    // supposingly we concatenate the university
    // and the team name together with "-"
    function getTeamIdentifier(submission) {
        let result = submission.university;
        if (submission.team)
            result += ' - ' + submission.team;
        return result;
    }

    // load the contest from the contest object
    function loadContest(contest) {
        name = contest.name;
        tasks = contest.tasks;
        duration = contest.duration;
        freeze = contest.freeze;
        submissions = contest.submissions;
        balloons = contest.balloons ?? {};
        name = languageConverter(name);
        submissions.forEach((submission) => {
            submission.university = languageConverter(submission.university);
            submission.team = languageConverter(submission.team);
        })
        // suppose to be sort in JSON, but just in case
        submissions.sort((a, b) => a.time - b.time);
        // compute teams dynamically from submissions
        teams = submissions.map((e) => getTeamIdentifier(e))
            .filter((value, index, array) => array.indexOf(value) === index);
        teams.push("你");
        $("#contest-name").html(name);
        prevEffectiveTime = -1; // forced reload of the scoreboard
        loadScoreboard(0);
    }

    function getTimeInSeconds() {
        const currentTime = new Date().getTime();
        const startTime = new Date($("#start-time").val()).getTime();
        let time = (currentTime - startTime) / 1000;
        time = Math.min(time, duration); // bounded by duration
        return time;
    }

    function addSubmission(task, verdict) {
        const submission = {
            "university": "你",
            "team": "",
            "task": task,
            "verdict": verdict,
            "time": getTimeInSeconds()
        };
        submissions.push(submission);
        submissions.sort((a, b) => a.time - b.time); // I am lazy
    }
    
    function getTimeStr(time, precision=2) {
        if (time < 0) {
            return getTimeStr(-time, precision) + " till start";
        }
        const hours = Math.floor(time / 3600);
        const minutes = Math.floor(time % 3600 / 60);
        const seconds = Math.floor(time % 60);
        let timeStr = "";
        if (precision >= 1) {
            timeStr += String(hours);
        }
        if (precision >= 2) {
            timeStr += ':' + String(minutes).padStart(2, '0');
        }
        if (precision >= 3) {
            timeStr += ':' + String(seconds).padStart(2, '0');
        }
        return timeStr;
    }

    // load the scoreboard
    function loadScoreboard() {
        if (tasks === undefined) {
            return;
        }
        $("#contest-metadata").css('display', 'flex');
        let time = getTimeInSeconds();
        $("#current-time").html(getTimeStr(time, precision=3));
        const status = {};
        const problemStats = {};

        teams.forEach(function(teamId) {
            const attempts = {};
            const attemptsFreezed = {};
            tasks.forEach(function(task) {
                attempts[task] = 0;
                attemptsFreezed[task] = 0;
            });
            status[teamId] = {
                'attempts': attempts,
                'attemptsFreezed': attemptsFreezed,
                'solves': {},
                'penalty': 0
            }
        });

        tasks.forEach(function(task) {
            problemStats[task] = {
                firstSolve: null,
                solveCount: 0,
                pendingCount: 0,
                attemptCount: 0
            }
        });

        // actual last submission processed
        let effectiveTime = 0;

        // assume submissions are sorted chronologically
        for (const submission of submissions) {
            if (submission.time > time) {
                break;
            }
            effectiveTime = Math.max(effectiveTime, submission.time);
            // the submission is freezed if the contest has not ended,
            // and the submission is submitted after the scoreboard freeze.
            const isFreezed = time < duration && submission.time >= duration - freeze;
            const task = submission.task;
            const teamId = getTeamIdentifier(submission);
            if (task in status[teamId].solves) {
                continue; // ignore if already ac
            }
            const teamStatus = status[teamId];
            
            // if freezed, we do not care the verdict of the submission,
            // so we just increment the freezed attempt of the task.
            if (isFreezed) {
                teamStatus.attemptsFreezed[task] += 1;
                problemStats[task].pendingCount += 1; // not shown for now
            } else {
                if (submission.verdict == 'accepted') {
                    // we do not increment attempts here if it is accepted
                    teamStatus.solves[task] = submission.time;
                    teamStatus.penalty += Math.floor(submission.time / 60) + teamStatus.attempts[task] * 20;
                    if (problemStats[task].firstSolve === null) { // first solved
                        problemStats[task].firstSolve = teamId;
                    }
                    problemStats[task].solveCount += 1;
                } else { // rejected
                    teamStatus.attempts[task] += 1;
                    problemStats[task].attemptCount += 1;
                }
            }
        }
        
        // sort by (solves ASC, penalty DESC)
        teams.sort(function(a, b) {
            if (Object.keys(status[b].solves).length != Object.keys(status[a].solves).length) {
                return Object.keys(status[b].solves).length - Object.keys(status[a].solves).length;
            }
            return status[a].penalty - status[b].penalty;
        })
        // only re-render if the scoreboard changes
        if (prevEffectiveTime == effectiveTime) {
            clearTimeout(timeout); // clear any other existing timeout
            timeout = setTimeout(loadScoreboard, 1000);
            return;
        }
        prevEffectiveTime = effectiveTime;
        // actually generating the scoreboard
        const columnCount = 2 + tasks.length;
        const scoreboard = $("#contest-scoreboard");
        scoreboard.css("grid-template-columns", `1fr 6fr repeat(${columnCount}, 1fr)`);
    	scoreboard.html("");
        
        // header
        scoreboard.append("<div>Rank</div>");
        scoreboard.append("<div>Team</div>");
        scoreboard.append("<div>Solves</div>");
        scoreboard.append("<div>Penalty</div>");
        tasks.forEach((task) => {
            const div = $(`<div class="task-label">${task}</div>`);
            if (balloons[task]) {
                const background_color = balloons[task].background_color;
                div.css('background-color', `color-mix(in srgb, var(--background-color) 50%, ${background_color} 50%)`)
            }
            div.on('click', function() {
                $("#task-id").html(task);
                $("#add-submission-popover").show();
            });
            scoreboard.append(div);
        })

        // for popovers mouse leave event.
        // sounds not optimal way to write this?
        $(document).click(function() {
            $("#add-submission-popover").hide();
        });
        $(".task-label").on('click', function(e) {
            e.stopPropagation();
            return false;
        })
        $("#add-submission-popover").click(function(e) {
            e.stopPropagation(); 
            return false;
        });
        
        // only increment rank when either solve count or penalty differs
        let rank = 0, order = 0;
        let prevSolveCount = -1, prevPenalty = -1;
        for (const team of teams) {
            order += 1;
            const solveCount = Object.keys(status[team].solves).length;
            const penalty = status[team].penalty;
            if (solveCount != prevSolveCount || penalty != prevPenalty) {
                rank = order;
            }
            prevSolveCount = solveCount; prevPenalty = penalty;
            scoreboard.append(`<div>${rank}</div>`);
            scoreboard.append(`<div>${team}</div>`);
            scoreboard.append(`<div>${solveCount}</div>`);
            scoreboard.append(`<div>${penalty}</div>`);
            for (const task of tasks) {
                const attempt = status[team].attempts[task];
                const freezedAttempt = status[team].attemptsFreezed[task];
                if (task in status[team].solves) {
                    const isFirstSolved = problemStats[task].firstSolve === team;
                    const timeStr = getTimeStr(status[team].solves[task]);
                    const divClass = isFirstSolved ? "first-solved" : "accepted";
                    scoreboard.append(`<div class="${divClass}">+${attempt > 0 ? attempt : ""}<br/>${timeStr}</div>`);
                } else if (freezedAttempt > 0) {
                    scoreboard.append(`<div class="freezed">?${freezedAttempt + attempt}</div>`);
                } else if (attempt > 0) {
                    scoreboard.append(`<div class="rejected">-${attempt}</div>`);
                } else {
                    scoreboard.append(`<div></div>`);
                }
            }
        }

        // footer
        scoreboard.append(`<div style="grid-column: span 4; grid-row: span 2"> Summary </div>`);
        tasks.forEach((task) => {
            const solveCount = problemStats[task].solveCount;
            scoreboard.append(`<div class="accepted task-stats">+ ${solveCount}</div>`);
        });
        tasks.forEach((task) => {
            const attemptCount = problemStats[task].attemptCount;
            scoreboard.append(`<div class="rejected task-stats">- ${attemptCount}</div>`);
        });
        if (time >= duration) return;
        clearTimeout(timeout);
        timeout = setTimeout(loadScoreboard, 1000);
    }
</script>
</body>
